# Nuclear AIMA — Netlify Config

# Root: Landing page (index.html)
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

# App SPA routing (panel interno)
[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

# Ensure .md files are served correctly
[[headers]]
  for = "*.md"
  [headers.values]
    Content-Type = "text/markdown"

# Cache PDFs
[[headers]]
  for = "*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
